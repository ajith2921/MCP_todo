services:
  - type: web
    name: todo-sql-mcp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --transport sse --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MCP_TRANSPORT
        value: sse

