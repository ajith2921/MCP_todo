[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-sql-mcp"
version = "0.1.0"
description = "Local SQL Todo and Project Task Manager MCP Server"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ajith" }
]
keywords = ["mcp", "model-context-protocol", "todo", "task-manager", "sql", "mysql", "claude"]
dependencies = [
    "mcp[cli]>=2.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "pymysql>=1.1.0",
    "cryptography>=41.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
todo-sql-mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["database.py", "server.py", "cli.py", "app.py"]
